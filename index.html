<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRJ LostLink</title>

<style>

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: auto;
        scroll-padding-top: 0;
        overflow-anchor: none;
    }

    body {
        margin: 0;
        padding: 16px;
        width: 100%;
        overflow-x: hidden;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }
    }

    .version-label {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>

<script>

    // Always open this page at the top
    if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
    }

</script>

</head>

<body>

<h1>PRJ LostLink</h1>

<p>Student Lost & Found System</p>

<hr>

<h2>Menu</h2>

<p>
    <a href="search.html">[1] Search for an item</a>
</p>

<p>
    <a href="report.html">[2] Report a lost/found item</a>
</p>

<p>
    <a href="latest.html">[3] View Latest Items</a>
</p>

<hr>

<h2>Recently Found Items</h2>

<div id="latestItems">
    Loading...
</div>

<p>
    <a href="latest.html">View all latest items →</a>
</p>

<div class="version-label">
    V.Prototype
</div>

<script src="script.js"></script>

<script>

    // Make sure the page finishes at the top
    window.addEventListener("load", function () {
        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "instant"
        });
    });

</script>

</body>

</html>
