    html, body {
        margin: 0;
        padding: 0;

        display: flex;

    .powered-by p {

        padding: 16px;
        width: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }
    }

    .version-label {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>

<script>

    // Prevent mobile browsers from restoring an old scroll position
    if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
    }

</script>

</head>
