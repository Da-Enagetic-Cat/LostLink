<div class="version-label">V.Prototype</div>
<script>
async function loadRecentItems() {

    const container =
        document.getElementById("recentItems");

    if (!container) return;

    try {

        const items =
            await getGoogleSheetItems();

        const approved =
            items.filter(item =>
                String(item["Status"])
                    .trim()
                    .toLowerCase() === "approved"
            );

        approved.sort((a, b) =>
            new Date(b["Timestamp"]) -
            new Date(a["Timestamp"])
        );

        const recent =
            approved.slice(0, 3);

        if (recent.length === 0) {

            container.innerHTML =
                "<p>No approved items yet.</p>";

            return;
        }

        container.innerHTML =
            recent.map(item => `
                <p>
                    ${escapeHTML(
                        item["Item name"] ||
                        "Unknown item"
                    )}
                </p>
            `).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load recent items.</p>";
    }
}

loadRecentItems();
</script>
