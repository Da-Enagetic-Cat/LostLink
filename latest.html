<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Items - PRJ LostLink</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            width: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        button {
            min-height: 44px;
            padding: 10px 16px;
            font-size: 16px;
        }

        .version-label {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            font-size: 12px;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<h1>PRJ LostLink</h1>

<h2>Latest Items</h2>

<div id="latestItems">
    Loading...
</div>

<br>

<a href="index.html">← Back to Home</a>

<div class="version-label">V.Prototype</div>

<script src="script.js"></script>

<script>
async function loadLatestItems() {

    const container =
        document.getElementById("latestItems");

    try {

        const items =
            await getGoogleSheetItems();

        const approved =
            items.filter(item =>
                String(item["Status"])
                    .trim()
                    .toLowerCase() === "approved"
            );

        approved.sort((a, b) =>
            new Date(b["Timestamp"]) -
            new Date(a["Timestamp"])
        );

        if (approved.length === 0) {

            container.innerHTML =
                "<p>No approved items yet.</p>";

            return;
        }

        container.innerHTML =
            approved.map(item => `
                <p>
                    ${escapeHTML(
                        item["Item name"] ||
                        "Unknown item"
                    )}
                </p>
            `).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load latest items.</p>";
    }
}

loadLatestItems();
</script>

</body>
</html>
