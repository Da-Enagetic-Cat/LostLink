<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search - PRJ LostLink</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 16px;
        width: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
    }

    input {
        width: 70%;
        max-width: 400px;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        min-height: 44px;
        font-size: 16px;
    }

    @media (max-width: 600px) {

        body {
            padding: 12px;
        }

        input {
            width: 100%;
            max-width: none;
        }

        button {
            width: 100%;
        }

    }

    .version-label {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>

</head>

<body>

<h1>LostLink NTW System</h1>

<p>Search for a lost or found item.</p>

<hr>

<h2>Search</h2>

<input
    type="text"
    id="searchBox"
    placeholder="Enter item name, description, or location"
>

<br>

<button
    type="button"
    onclick="searchItem()"
>
    Search
</button>

<hr>

<div id="results">
    Enter a search term above.
</div>

<p>
    <a href="index.html">← Back to Home</a>
</p>

<div class="version-label">
    Alpha Prototype
</div>

<script src="script.js"></script>

</body>

</html>
